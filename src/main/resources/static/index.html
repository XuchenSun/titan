<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Titan Scanner — Vulnerability Report</title>
<style>
/* ── Reset & Base ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0A0A12;
  --surface:   #12121E;
  --surface2:  #1A1A2E;
  --border:    rgba(255,255,255,0.08);
  --purple:    #6C57FF;
  --cyan:      #38BDF8;
  --text:      #E8E8F0;
  --muted:     rgba(255,255,255,0.45);
  --critical:  #F87171;
  --high:      #FB923C;
  --medium:    #FBBF24;
  --low:       #34D399;
  --none:      #60A5FA;
}

html { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── Layout ───────────────────────────────────────────────────── */
.page { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }

/* ── Header ───────────────────────────────────────────────────── */
header { text-align: center; padding: 48px 0 40px; position: relative; }

.logo-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 72px; height: 72px; border-radius: 20px; margin-bottom: 20px;
  background: linear-gradient(135deg, var(--purple), var(--cyan));
  box-shadow: 0 0 40px rgba(108,87,255,.45);
  font-size: 34px;
}

header h1 {
  font-size: 32px; font-weight: 700; letter-spacing: -.5px;
  background: linear-gradient(120deg, #fff 40%, var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

header p { margin-top: 8px; color: var(--muted); font-size: 15px; }

/* ── Glow blobs ───────────────────────────────────────────────── */
.glow-purple {
  position: fixed; width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(108,87,255,.14) 0%, transparent 70%);
  top: -100px; left: -150px; pointer-events: none;
}
.glow-cyan {
  position: fixed; width: 400px; height: 400px; border-radius: 50%;
  background: radial-gradient(circle, rgba(56,189,248,.10) 0%, transparent 70%);
  bottom: 0; right: -100px; pointer-events: none;
}

/* ── Input card ───────────────────────────────────────────────── */
.input-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  margin-bottom: 32px;
}

.input-label {
  font-size: 11px; font-weight: 600; letter-spacing: .7px;
  color: var(--muted); text-transform: uppercase; margin-bottom: 8px;
}

.input-row {
  display: flex; gap: 10px; flex-wrap: wrap;
}

.field-wrap {
  flex: 1; min-width: 220px; position: relative;
}

.field-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 18px; pointer-events: none;
  transition: color .2s;
}

input[type=text], input[type=password] {
  width: 100%; height: 52px; border-radius: 14px; border: 1px solid var(--border);
  background: rgba(255,255,255,.04); color: var(--text);
  font-size: 14px; padding: 0 14px 0 44px;
  outline: none; transition: border-color .2s, box-shadow .2s;
}

input[type=text]:focus, input[type=password]:focus {
  border-color: rgba(108,87,255,.6);
  box-shadow: 0 0 0 3px rgba(108,87,255,.12);
}

input::placeholder { color: rgba(255,255,255,.25); }

.btn-scan {
  height: 52px; padding: 0 28px; border-radius: 14px; border: none;
  background: linear-gradient(90deg, var(--purple), var(--cyan));
  color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  white-space: nowrap; box-shadow: 0 4px 20px rgba(108,87,255,.4);
  transition: opacity .2s, transform .1s;
}
.btn-scan:hover { opacity: .9; }
.btn-scan:active { transform: scale(.98); }
.btn-scan:disabled { opacity: .5; cursor: not-allowed; }

.hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
.hint a { color: var(--cyan); text-decoration: none; }

/* ── Progress bar ─────────────────────────────────────────────── */
.progress-wrap { display: none; margin-bottom: 24px; }
.progress-wrap.show { display: block; }
.progress-bar-bg {
  height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--purple), var(--cyan));
  border-radius: 2px; transition: width .4s ease;
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
  0%   { filter: brightness(1); }
  50%  { filter: brightness(1.4); }
  100% { filter: brightness(1); }
}
.progress-label { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }

/* ── Error banner ─────────────────────────────────────────────── */
.error-banner {
  display: none; background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3);
  border-radius: 14px; padding: 14px 18px; color: var(--critical);
  font-size: 14px; margin-bottom: 24px;
}
.error-banner.show { display: flex; gap: 10px; align-items: flex-start; }

/* ── Summary cards ────────────────────────────────────────────── */
.summary-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px; margin-bottom: 28px;
}

.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 18px 16px;
  text-align: center; position: relative; overflow: hidden;
}
.stat-card::before {
  content: ''; position: absolute; inset: 0;
  background: var(--accent-color, transparent); opacity: .06; pointer-events: none;
}

.stat-value {
  font-size: 32px; font-weight: 700; line-height: 1;
  color: var(--accent-color, var(--text));
}
.stat-label { font-size: 11px; color: var(--muted); margin-top: 6px; text-transform: uppercase; letter-spacing: .5px; }
.stat-badge {
  display: inline-block; font-size: 18px; margin-bottom: 6px;
}

/* ── Severity legend ──────────────────────────────────────────── */
.severity-bar {
  display: flex; height: 8px; border-radius: 4px; overflow: hidden;
  margin-bottom: 24px; gap: 2px;
}
.sev-seg { transition: flex .5s ease; }
.sev-seg[data-sev=CRITICAL] { background: var(--critical); }
.sev-seg[data-sev=HIGH]     { background: var(--high); }
.sev-seg[data-sev=MEDIUM]   { background: var(--medium); }
.sev-seg[data-sev=LOW]      { background: var(--low); }
.sev-seg[data-sev=UNKNOWN]  { background: var(--muted); }

/* ── Section heading ──────────────────────────────────────────── */
.section-head {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .6px;
  margin-bottom: 12px;
}
.section-head .badge-count {
  background: rgba(255,255,255,.08); border-radius: 20px;
  padding: 2px 10px; font-size: 11px;
}

/* ── Vuln cards ───────────────────────────────────────────────── */
.vuln-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }

.vuln-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden;
  transition: border-color .2s;
}
.vuln-card:hover { border-color: rgba(255,255,255,.15); }

.vuln-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; cursor: pointer; user-select: none;
}

.sev-pill {
  flex-shrink: 0; font-size: 10px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px; letter-spacing: .5px;
  text-transform: uppercase;
}
.sev-pill[data-sev=CRITICAL] { background: rgba(248,113,113,.15); color: var(--critical); }
.sev-pill[data-sev=HIGH]     { background: rgba(251,146,60,.15);  color: var(--high);     }
.sev-pill[data-sev=MEDIUM]   { background: rgba(251,191,36,.15);  color: var(--medium);   }
.sev-pill[data-sev=LOW]      { background: rgba(52,211,153,.15);  color: var(--low);      }
.sev-pill[data-sev=UNKNOWN]  { background: rgba(255,255,255,.08); color: var(--muted);    }

.vuln-title { flex: 1; min-width: 0; }
.vuln-dep { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vuln-summary { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.cve-tag {
  flex-shrink: 0; font-size: 11px; font-family: monospace;
  background: rgba(56,189,248,.1); color: var(--cyan);
  border: 1px solid rgba(56,189,248,.2); padding: 2px 8px; border-radius: 6px;
}

.chevron { flex-shrink: 0; color: var(--muted); font-size: 14px; transition: transform .2s; }
.vuln-card.open .chevron { transform: rotate(180deg); }

.vuln-body {
  display: none; padding: 0 18px 16px;
  border-top: 1px solid var(--border);
}
.vuln-card.open .vuln-body { display: block; padding-top: 14px; }

.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.detail-item { }
.detail-key {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .5px; color: var(--muted); margin-bottom: 3px;
}
.detail-val { font-size: 13px; font-family: monospace; color: var(--text); word-break: break-all; }
.detail-val.fix { color: var(--low); }

/* ── Meta info ────────────────────────────────────────────────── */
.meta-row {
  display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
  padding: 14px 18px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 28px; font-size: 13px;
}
.meta-item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.meta-item strong { color: var(--text); }
.meta-pill {
  background: rgba(108,87,255,.12); color: var(--purple);
  border: 1px solid rgba(108,87,255,.25); border-radius: 6px;
  padding: 2px 8px; font-size: 11px; font-weight: 600;
}

/* ── Clean deps section ───────────────────────────────────────── */
.clean-grid {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 32px;
}
.clean-tag {
  background: rgba(52,211,153,.07); border: 1px solid rgba(52,211,153,.18);
  color: rgba(52,211,153,.8); border-radius: 8px;
  padding: 4px 10px; font-size: 11px; font-family: monospace;
}

/* ── Actions bar ──────────────────────────────────────────────── */
.actions { display: flex; gap: 10px; margin-bottom: 32px; flex-wrap: wrap; }
.btn-ghost {
  height: 40px; padding: 0 18px; border-radius: 10px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text); font-size: 13px; cursor: pointer;
  transition: background .2s, border-color .2s;
  display: flex; align-items: center; gap: 7px;
}
.btn-ghost:hover { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.16); }

/* ── Report hidden by default ─────────────────────────────────── */
#report { display: none; }
#report.show { display: block; }

/* ── Responsive ───────────────────────────────────────────────── */
@media (max-width: 600px) {
  header h1 { font-size: 24px; }
  .input-row { flex-direction: column; }
  .detail-grid { grid-template-columns: 1fr; }
  .summary-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<div class="glow-purple"></div>
<div class="glow-cyan"></div>

<div class="page">

  <!-- Header -->
  <header>
    <div class="logo-badge">🛡️</div>
    <h1>Titan Scanner</h1>
    <p>Paste any GitHub repository URL to get a full vulnerability report</p>
  </header>

  <!-- Input card -->
  <div class="input-card">
    <div class="input-label">GitHub Repository URL</div>
    <div class="input-row">
      <div class="field-wrap" style="flex: 2">
        <span class="field-icon">⎇</span>
        <input type="text" id="repoUrl"
               placeholder="https://github.com/apache/struts"
               autocomplete="off" spellcheck="false"/>
      </div>
      <div class="field-wrap" style="flex: 1">
        <span class="field-icon" style="font-size:14px">🔑</span>
        <input type="password" id="githubToken" placeholder="GitHub token (optional)"/>
      </div>
      <button class="btn-scan" id="scanBtn" onclick="startScan()">
        Scan Repository
      </button>
    </div>
    <div class="hint">
      GitHub token increases rate limit from 60 → 5 000 req/hr.
      <a href="https://github.com/settings/tokens" target="_blank">Get a token →</a>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="progress-label" id="progressLabel">Connecting to GitHub…</div>
  </div>

  <!-- Error -->
  <div class="error-banner" id="errorBanner">
    <span>⚠️</span>
    <span id="errorMsg"></span>
  </div>

  <!-- Report -->
  <div id="report">

    <!-- Metadata row -->
    <div class="meta-row" id="metaRow"></div>

    <!-- Summary cards -->
    <div class="summary-grid" id="summaryGrid"></div>

    <!-- Severity distribution bar -->
    <div class="severity-bar" id="severityBar"></div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn-ghost" onclick="copyJson()">📋 Copy JSON</button>
      <button class="btn-ghost" onclick="window.print()">🖨️ Print</button>
      <button class="btn-ghost" onclick="resetScan()">🔄 New Scan</button>
    </div>

    <!-- Vulnerabilities -->
    <div id="vulnSection">
      <div class="section-head">
        🔴 Vulnerabilities
        <span class="badge-count" id="vulnCount">0</span>
      </div>
      <div class="vuln-list" id="vulnList"></div>
    </div>

    <!-- Clean dependencies (collapsible) -->
    <div id="cleanSection">
      <div class="section-head" style="cursor:pointer" onclick="toggleClean()">
        ✅ Clean Dependencies
        <span class="badge-count" id="cleanCount">0</span>
        <span id="cleanChevron" style="margin-left:auto">▼</span>
      </div>
      <div class="clean-grid" id="cleanGrid" style="display:none"></div>
    </div>

  </div><!-- /report -->

</div><!-- /page -->

<script>
// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
let lastReport = null;

// ─────────────────────────────────────────────────────────────────────────────
// Enter key triggers scan
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('repoUrl').addEventListener('keydown', e => {
  if (e.key === 'Enter') startScan();
});

// ─────────────────────────────────────────────────────────────────────────────
// Main scan function
// ─────────────────────────────────────────────────────────────────────────────
async function startScan() {
  const url   = document.getElementById('repoUrl').value.trim();
  const token = document.getElementById('githubToken').value.trim();

  if (!url) {
    shake(document.getElementById('repoUrl'));
    return;
  }
  if (!url.match(/github\.com\/[\w.\-]+\/[\w.\-]+/)) {
    showError('Please enter a valid GitHub repository URL (e.g. https://github.com/owner/repo)');
    return;
  }

  // Reset UI
  hideError();
  hideReport();
  setProgress(5, 'Connecting to GitHub…');
  document.getElementById('scanBtn').disabled = true;

  // Animate progress through stages
  const stages = [
    [15, 'Fetching repository metadata…'],
    [35, 'Discovering dependency files…'],
    [55, 'Parsing dependencies…'],
    [75, 'Querying OSV vulnerability database…'],
    [90, 'Building report…'],
  ];
  let stageIdx = 0;
  const stageTimer = setInterval(() => {
    if (stageIdx < stages.length) {
      const [pct, label] = stages[stageIdx++];
      setProgress(pct, label);
    }
  }, 1400);

  try {
    const body = { url };
    if (token) body.githubToken = token;

    const res = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    clearInterval(stageTimer);

    const data = await res.json();
    lastReport = data;

    if (data.error) {
      setProgress(100, 'Done');
      setTimeout(() => hideProgress(), 400);
      showError(data.error);
      return;
    }

    setProgress(100, 'Complete!');
    setTimeout(() => {
      hideProgress();
      renderReport(data);
    }, 400);

  } catch (err) {
    clearInterval(stageTimer);
    hideProgress();
    showError('Could not reach the scanner backend. Make sure Spring Boot is running on port 8080.');
  } finally {
    document.getElementById('scanBtn').disabled = false;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Render report
// ─────────────────────────────────────────────────────────────────────────────
function renderReport(data) {
  const s = data.summary;

  // ── Meta row ──────────────────────────────────────────────────────
  document.getElementById('metaRow').innerHTML = `
    <div class="meta-item">📦 <strong>${data.owner}/${data.repo}</strong></div>
    <div class="meta-item">🌿 Branch: <strong>${data.defaultBranch}</strong></div>
    <div class="meta-item">📄 Files: ${data.scannedFiles.map(f =>
      `<span class="meta-pill">${f}</span>`).join(' ')}</div>
    <div class="meta-item">🕐 ${new Date(data.scannedAt).toLocaleString()}</div>
  `;

  // ── Summary cards ─────────────────────────────────────────────────
  const cards = [
    { label: 'Total Deps',   value: s.totalDependencies,    emoji: '📦', color: 'var(--cyan)' },
    { label: 'Vulnerable',   value: s.vulnerableDependencies, emoji: '⚠️', color: s.vulnerableDependencies > 0 ? 'var(--critical)' : 'var(--low)' },
    { label: 'Critical',     value: s.criticalCount,          emoji: '🔴', color: 'var(--critical)' },
    { label: 'High',         value: s.highCount,              emoji: '🟠', color: 'var(--high)' },
    { label: 'Medium',       value: s.mediumCount,            emoji: '🟡', color: 'var(--medium)' },
    { label: 'Low',          value: s.lowCount,               emoji: '🟢', color: 'var(--low)' },
  ];

  document.getElementById('summaryGrid').innerHTML = cards.map(c => `
    <div class="stat-card" style="--accent-color:${c.color}">
      <div class="stat-badge">${c.emoji}</div>
      <div class="stat-value">${c.value}</div>
      <div class="stat-label">${c.label}</div>
    </div>
  `).join('');

  // ── Severity distribution bar ──────────────────────────────────────
  const total = data.vulnerabilities.length || 1;
  const sevGroups = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0, UNKNOWN: 0 };
  data.vulnerabilities.forEach(v => { sevGroups[v.severity] = (sevGroups[v.severity] || 0) + 1; });
  document.getElementById('severityBar').innerHTML = Object.entries(sevGroups)
    .filter(([, n]) => n > 0)
    .map(([sev, n]) => `<div class="sev-seg" data-sev="${sev}" style="flex:${n}"></div>`)
    .join('');

  // ── Vulnerability cards ────────────────────────────────────────────
  document.getElementById('vulnCount').textContent = data.vulnerabilities.length;
  const vulnList = document.getElementById('vulnList');
  if (data.vulnerabilities.length === 0) {
    vulnList.innerHTML = `
      <div style="text-align:center;padding:40px;color:var(--muted)">
        <div style="font-size:40px;margin-bottom:12px">🎉</div>
        <div style="font-size:16px;font-weight:600;color:var(--low)">No vulnerabilities found!</div>
        <div style="font-size:13px;margin-top:6px">All scanned dependencies are clean.</div>
      </div>`;
  } else {
    vulnList.innerHTML = data.vulnerabilities.map((v, i) => renderVulnCard(v, i)).join('');
  }

  // ── Clean deps ─────────────────────────────────────────────────────
  document.getElementById('cleanCount').textContent = data.cleanDependencies.length;
  document.getElementById('cleanGrid').innerHTML =
    data.cleanDependencies.map(d =>
      `<span class="clean-tag">${d.groupId}${d.artifactId ? ':' + d.artifactId : ''}:${d.version}</span>`
    ).join('');

  showReport();
  window.scrollTo({ top: document.getElementById('report').offsetTop - 20, behavior: 'smooth' });
}

function renderVulnCard(v, i) {
  const cveLabel = v.cveIds && v.cveIds.length > 0 ? v.cveIds[0] : v.osvId;
  const dep = v.dependency;

  return `
  <div class="vuln-card" id="card-${i}">
    <div class="vuln-header" onclick="toggleCard(${i})">
      <span class="sev-pill" data-sev="${v.severity}">${v.severity}</span>
      <div class="vuln-title">
        <div class="vuln-dep">${dep.groupId}${dep.artifactId ? ':' + dep.artifactId : ''}:${dep.version}</div>
        <div class="vuln-summary">${v.summary || 'No description available'}</div>
      </div>
      ${v.cveIds && v.cveIds.length > 0 ? `<span class="cve-tag">${v.cveIds[0]}</span>` : ''}
      <span class="chevron">▾</span>
    </div>
    <div class="vuln-body">
      <div class="detail-grid">
        <div class="detail-item">
          <div class="detail-key">OSV ID</div>
          <div class="detail-val">
            <a href="https://osv.dev/vulnerability/${v.osvId}" target="_blank"
               style="color:var(--cyan);text-decoration:none">${v.osvId}</a>
          </div>
        </div>
        ${v.cveIds && v.cveIds.length > 0 ? `
        <div class="detail-item">
          <div class="detail-key">CVE ID(s)</div>
          <div class="detail-val">${v.cveIds.map(c =>
            `<a href="https://nvd.nist.gov/vuln/detail/${c}" target="_blank"
                style="color:var(--cyan);text-decoration:none;margin-right:6px">${c}</a>`
          ).join('')}</div>
        </div>` : ''}
        <div class="detail-item">
          <div class="detail-key">Ecosystem</div>
          <div class="detail-val">${dep.ecosystem}</div>
        </div>
        <div class="detail-item">
          <div class="detail-key">Source File</div>
          <div class="detail-val">${dep.sourceFile}</div>
        </div>
        ${v.fixedVersion ? `
        <div class="detail-item">
          <div class="detail-key">Fixed In</div>
          <div class="detail-val fix">≥ ${v.fixedVersion}</div>
        </div>` : ''}
        ${v.cvssV3Vector ? `
        <div class="detail-item" style="grid-column:1/-1">
          <div class="detail-key">CVSS v3 Vector</div>
          <div class="detail-val">${v.cvssV3Vector}</div>
        </div>` : ''}
        ${v.summary ? `
        <div class="detail-item" style="grid-column:1/-1">
          <div class="detail-key">Description</div>
          <div class="detail-val" style="font-family:inherit;line-height:1.5">${v.summary}</div>
        </div>` : ''}
      </div>
    </div>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// UI helpers
// ─────────────────────────────────────────────────────────────────────────────
function toggleCard(i) {
  const card = document.getElementById('card-' + i);
  card.classList.toggle('open');
}

function toggleClean() {
  const grid = document.getElementById('cleanGrid');
  const ch   = document.getElementById('cleanChevron');
  const open = grid.style.display !== 'none';
  grid.style.display = open ? 'none' : 'flex';
  ch.textContent = open ? '▼' : '▲';
}

function setProgress(pct, label) {
  document.getElementById('progressWrap').classList.add('show');
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = label;
}

function hideProgress() {
  document.getElementById('progressWrap').classList.remove('show');
  document.getElementById('progressFill').style.width = '0%';
}

function showError(msg) {
  const el = document.getElementById('errorBanner');
  document.getElementById('errorMsg').textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('errorBanner').classList.remove('show');
}

function showReport() {
  document.getElementById('report').classList.add('show');
}

function hideReport() {
  document.getElementById('report').classList.remove('show');
}

function resetScan() {
  hideReport();
  hideError();
  document.getElementById('repoUrl').value = '';
  document.getElementById('repoUrl').focus();
  lastReport = null;
}

function copyJson() {
  if (!lastReport) return;
  navigator.clipboard.writeText(JSON.stringify(lastReport, null, 2))
    .then(() => alert('Report JSON copied to clipboard!'))
    .catch(() => prompt('Copy the JSON below:', JSON.stringify(lastReport, null, 2)));
}

function shake(el) {
  el.style.animation = 'none';
  el.offsetHeight; // reflow
  el.style.animation = 'shake .4s ease';
}

// Shake keyframe via JS
const style = document.createElement('style');
style.textContent = `
@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}`;
document.head.appendChild(style);
</script>
